<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mehboob's Signature Scent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15100B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Signature Scent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="title.jpg">
<style>
:root{
  --bg:#F6F1E8; --surface:#FFFDF8; --ink:#2A1D12; --muted:#75654F; --line:#E4D8C4;
  --amber:#96651A; --teal:#2F6F69; --glass:#EFE6D6;
  --summer-bg:#DCEFEA; --summer:#2E6B5E; --winter-bg:#F3E0CC; --winter:#8A4B1A; --all-bg:#E6E4F3; --all:#4B4680;
  --shadow:0 1px 2px rgba(42,29,18,.06); --bottle:#EADFCB; --bottle-text:#6B5B48; --spark:#3A2D1E;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100B; --surface:#211910; --ink:#F3EADB; --muted:#B3A48F; --line:#3A2D1E;
    --amber:#E0B060; --teal:#6FB3A8; --glass:#2B2116;
    --summer-bg:#1E3631; --summer:#8ED0C0; --winter-bg:#3F2A17; --winter:#EDB37A; --all-bg:#2A2840; --all:#B9B4E8;
    --shadow:none; --bottle:#2B2116; --bottle-text:#B3A48F; --spark:#E0B060;
  }
}
:root[data-theme="dark"]{
  --bg:#15100B; --surface:#211910; --ink:#F3EADB; --muted:#B3A48F; --line:#3A2D1E;
  --amber:#E0B060; --teal:#6FB3A8; --glass:#2B2116;
  --summer-bg:#1E3631; --summer:#8ED0C0; --winter-bg:#3F2A17; --winter:#EDB37A; --all-bg:#2A2840; --all:#B9B4E8;
  --shadow:none; --bottle:#2B2116; --bottle-text:#B3A48F; --spark:#E0B060;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",Arial,Helvetica,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(160px + env(safe-area-inset-bottom,0px))}

header.top{padding:18px 0 4px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.appbar{display:flex;align-items:center;gap:10px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.appname{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.1}
.appname span{color:var(--amber)}
h1{font-family:var(--serif);font-size:32px;line-height:1;margin:0;font-weight:700}
h1 small{font-family:"Figtree",Arial,sans-serif}
h1 small{display:block;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.count{font-size:13px;color:var(--muted);white-space:nowrap}

.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:48px;padding:0 12px 0 42px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:3;background:var(--bg);margin:6px -16px 0;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.group-title{font-size:18px;font-weight:700;margin:18px 0 8px}
.group-title span{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease}
.item:active{transform:scale(.985)}
.item .av{grid-row:1/3;grid-column:1;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--bottle);color:var(--amber);font-family:var(--serif);font-weight:700;font-size:22px;line-height:1}
.item .name{grid-column:2;font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;min-width:0}
.item .name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{grid-column:2;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .right{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ratio{font-weight:800;color:var(--amber);font-size:15px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.t-Summer{background:var(--summer-bg);color:var(--summer)}
.t-Winter{background:var(--winter-bg);color:var(--winter)}
.t-All{background:var(--all-bg);color:var(--all)}
.dots{letter-spacing:1px;font-size:11px;color:var(--ink)}
.dots .off{color:var(--line)}
.fav{color:var(--amber);font-size:15px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(20,12,4,.10);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.dockrow{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.dockrow[hidden]{display:none}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs .in button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs .in button svg{box-sizing:content-box;padding:3px 16px;border-radius:999px;transition:background .2s ease}
nav.tabs .in button[aria-current="page"]{color:var(--ink)}
nav.tabs .in button[aria-current="page"] svg{color:var(--amber);background:var(--glass)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,15,.45);z-index:10;display:none}
.overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;z-index:11;transform:translateY(105%);transition:transform .28s ease;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet .in{max-width:720px;margin:0 auto;padding:10px 18px 0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-family:var(--serif);font-size:32px;line-height:1.02;margin:0;font-weight:700}
.sheet .lead{color:var(--muted);margin:6px 0 0}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn.on{color:var(--amber);border-color:var(--amber)}

.mixer{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:center;margin:20px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.bottle{width:100%;height:auto;display:block}
.layer{transition:y .4s ease,height .4s ease}
.sizes{display:flex;gap:6px;margin-bottom:12px}
.sizes button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 0;font-weight:700;cursor:pointer;font-size:14px}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lbl{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.row .val{font-weight:800;font-size:20px;white-space:nowrap}
.row .val small{font-size:12px;color:var(--muted);font-weight:600;margin-left:4px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.block h3{margin:0 0 6px;font-size:15px;font-weight:700}
.block p{margin:0;color:var(--ink)}
.tip{border-left:3px solid var(--amber)}
.links{display:flex;flex-direction:column;gap:8px}
.linkbtn{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;text-align:left;width:100%;font-weight:600}
.linkbtn span{color:var(--muted);font-weight:500;font-size:13px}

.pyramid{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 auto;width:100%}
.tier:nth-child(1){width:78%}
.tier:nth-child(2){width:89%}
.tier b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}

/* custom */
.form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
input[type=range]{width:100%;accent-color:var(--amber)}
.rangeval{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.rangeval b{color:var(--ink);font-size:16px}
.note{font-size:13px;color:var(--muted);margin-top:8px}

.bought{color:var(--summer);font-size:14px;font-weight:800}
.iconbtn.ok{color:var(--summer);border-color:var(--summer);background:var(--summer-bg)}
.ok-block{border-color:var(--summer)}
.muted{color:var(--muted);font-weight:500;font-size:13px}
.mini{display:block;font-size:13px;color:var(--muted);margin:4px 0 6px}
textarea,.field input:not([type=range]){font-family:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;resize:vertical}
.block textarea{background:var(--bg)}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;font-size:15px}
.btn.danger{color:#B4413C;border-color:#E3B9B6}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.restore{display:block;margin:18px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
.fab{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:var(--amber);color:var(--bg);font-size:28px;font-weight:500;line-height:1;cursor:pointer}
.fab:active{transform:scale(.94)}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sync{font-size:12px;color:var(--summer);font-weight:600;margin-top:4px}
/* title page */
.splash{position:fixed;inset:0;z-index:50;background:#15100B url(title.jpg) center/cover no-repeat;color:#F6EBD8;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(48px + env(safe-area-inset-bottom,0px));text-align:center;cursor:pointer;border:0;width:100%;transition:opacity .6s ease,visibility .6s}
.splash::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,10,6,.30) 0%,rgba(15,10,6,0) 28%,rgba(15,10,6,.50) 56%,rgba(15,10,6,.95) 100%)}
.splash>*{position:relative;display:block}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash .eyebrow{font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#E0B060;animation:rise .9s .1s ease both}
.splash .stitle{font-family:var(--serif);font-size:clamp(44px,13vw,68px);font-weight:700;line-height:.95;margin:10px 0 0;text-shadow:0 2px 18px rgba(0,0,0,.55);animation:rise .9s .22s ease both}
.splash .stitle span{display:block;color:#E9BC6C}
.splash .stag{color:#DCCDB4;font-size:16px;margin:14px 0 0;animation:rise .9s .38s ease both}
.splash .enter{margin-top:28px;background:#E0B060;color:#1B1208;border-radius:999px;padding:14px 38px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:rise .9s .52s ease both}
@media (min-width:700px){ .splash{background-size:contain} }
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .splash,.splash *{animation:none!important;transition:none} }
@media (min-width:600px){ h1{font-size:38px} .appname{font-size:28px} .mixer{grid-template-columns:130px 1fr} }
@media (prefers-reduced-motion:reduce){ .sheet,.layer{transition:none} }
</style>
</head>
<body>
<button class="splash" id="splash" aria-label="App kholein">
  <span class="eyebrow">Attar · Oud · Perfume</span>
  <span class="stitle">Mehboob's <span>Signature Scent</span></span>
  <span class="stag">Apni khushbu, apna formula</span>
  <span class="enter">Shuru karein</span>
</button>
<div class="wrap">
  <header class="top">
    <div class="appbar">
      <svg width="22" height="30" viewBox="0 0 22 30" aria-hidden="true"><rect x="7" y="1" width="8" height="5" rx="1.5" fill="var(--ink)"/><rect x="9" y="6" width="4" height="4" fill="var(--ink)"/><rect x="2" y="10" width="18" height="19" rx="5" fill="var(--bottle)" stroke="var(--ink)" stroke-width="1.5"/><rect x="2.75" y="21" width="16.5" height="7.25" rx="4" fill="var(--amber)"/><rect x="2.75" y="18" width="16.5" height="3.5" fill="var(--teal)"/></svg>
      <div class="appname">Mehboob's <span>Signature Scent</span></div>
    </div>
    <div class="brand">
      <h1 id="title">Mix formulas<small id="subtitle">50ml bottle ke liye gram ka hisaab</small></h1>
      <div style="text-align:right"><div class="count" id="count"></div><div class="sync" id="sync" hidden>✓ Sheet se juda hua</div></div>
    </div>
  </header>

  <section id="view-list">
    <div class="chips" id="chips" role="group" aria-label="Filter"></div>
    <div id="results"></div>
  </section>

  <section id="view-custom" hidden>
    <div class="form">
      <div class="field"><label for="ca">Pehla perfume (A)</label><select id="ca"></select></div>
      <div class="field"><label for="cb">Doosra perfume (B)</label><select id="cb"></select></div>
      <div class="field">
        <label for="cr">Ratio A : B</label>
        <input id="cr" type="range" min="10" max="90" step="5" value="50">
        <div class="rangeval"><span>B zyada</span><b id="crv">50 : 50</b><span>A zyada</span></div>
      </div>
      <div class="field">
        <label for="cp">Oil %</label>
        <input id="cp" type="range" min="15" max="35" step="1" value="30">
        <div class="rangeval"><span>Halka</span><b id="cpv">30%</b><span>Tez</span></div>
      </div>
    </div>
    <div id="custom-out"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Sections">
<div class="dockrow" id="dockrow">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" enterkeyhint="search" placeholder="Naam ya note dhoondein" aria-label="Dhoondein">
  </div>
  <button class="fab" id="fab" aria-label="Naya add karein">+</button>
</div>
<div class="in">
  <button data-tab="perfumes" aria-current="page">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="8" width="12" height="13" rx="2"/><path d="M10 8V5h4v3M9 3h6"/></svg>Perfumes</button>
  <button data-tab="mixes">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v4l-4 6v6a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-6l-4-6V3"/><path d="M6 14h12"/></svg>Mixes</button>
  <button data-tab="custom">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/></svg>Apna mix</button>
</div></nav>

<div class="overlay" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="in" id="sheet-in"></div></div>

<script>
function bottleSVG(a,b,sz,id){
  const top=216.06, H=195.33, hA=a/sz*H, hB=b/sz*H, alc=H-hA-hB;
  return `<svg class="bottle" viewBox="0 0 160.15 422.83" role="img" aria-label="Bottle mein oil aur alcohol ka hissa">
    <defs><clipPath id="clip${id}"><path d="M10.02,216.06h139.75v175.09c0,11.17-9.07,20.24-20.24,20.24H30.26c-11.17,0-20.24-9.07-20.24-20.24v-175.09h0Z"/></clipPath></defs>
    <path fill="var(--bottle)" stroke="#2e3b39" stroke-width="3" d="M38.11,146.16c-7.98,4.05-15.84,8.13-22.06,14.94-9.27,10.15-14.44,21.73-14.44,35.56,0,48.07-.06,148.37-.1,197.02-.01,15.27,12.36,27.65,27.63,27.65h101.89c15.26,0,27.64-12.37,27.63-27.64-.02-48.75-.06-149.43,0-198.02.01-10.81-3.62-20.35-9.63-28.94-6.72-9.61-16.27-16.09-26.99-20.36l-83.92-.2Z"/>
    <path fill="#0b0f0e" stroke="#2e3b39" stroke-width="3" d="M104.11,66.66V18.66c-16.33,0-31.91,0-48,0v48"/>

/* ---------- server bridge ---------- */
const hasGAS=typeof google!=="undefined"&&google.script&&google.script.run;
const API_URL="https://script.google.com/macros/s/AKfycbwznskjOS08J417rDil_90vr11BHSiSHh-hyxlb4jJTLMzL7vYGURUkkyBv6mOoJ-Fw8A/exec";
function call(fn,...args){
  if(hasGAS)return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  /* GitHub Pages: Apps Script JSON API (text/plain se CORS preflight nahi hota) */
  const req=fn==="getData"
    ? fetch(API_URL+"?fn=getData")
    : fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})});
  return req.then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||"Server error");return j.result});
}

/* ---------- local prefs ---------- */
const LS="ss-gas-prefs";
let PREF=(()=>{try{return Object.assign({size:50,custom:{a:"bdc",b:"narciso",r:50,p:30}},JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){return{size:50,custom:{a:"bdc",b:"narciso",r:50,p:30}}}})();
const savePref=()=>{try{localStorage.setItem(LS,JSON.stringify(PREF))}catch(e){}};

/* ---------- data ---------- */
let P={}, M=[], loaded=false;
function setData(d){
  P={}; d.perfumes.forEach(p=>P[p.id]=p);
  M=d.mixes.filter(m=>P[m.a]&&P[m.b]).map((m,i)=>Object.assign({},m,{no:i+1}));
  loaded=true;
}
function load(){
  return call("getData").then(d=>{setData(d);refresh()}).catch(err=>{
    $("#results").innerHTML=`<div class="empty">Data load nahi hua: ${esc(err.message||err)}<br><button class="chip" id="retry">Dobara koshish karein</button></div>`;
  });
}
function serverWrite(fn,args,okMsg){
  setBusy(true);
  return call(fn,...args).then(r=>{const d=r&&r.data?r.data:r;setData(d);refresh();if(okMsg)toast(okMsg);return r})
    .catch(err=>{toast("Save nahi hua: "+(err.message||err));load()}).finally(()=>setBusy(false));
}
function setBusy(b){$("#sync").hidden=false;$("#sync").textContent=b?"Save ho raha hai…":"✓ Sheet se juda hua"}

function refresh(){
  if(tab==="custom")renderCustom();else{renderChips();renderList()}
  if(current){
    if(current.type==="mix"&&M.find(m=>m.id===current.id))openMix(current.id,$("#sheet").scrollTop||1);
    else if(current.type==="p"&&P[current.id])openPerfume(current.id,true);
  }
}

let tab="perfumes", filter="all", current=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{const r=Math.round(n*100)/100;return (r%1===0?r.toFixed(0):r.toFixed(2).replace(/0$/,""))};
const tagCls=s=>"t-"+(String(s).startsWith("All")?"All":String(s).startsWith("Summer")?"Summer":"Winter");
const dots=n=>{n=Math.max(1,Math.min(5,n||3));return '<span class="dots" aria-label="Intensity '+n+' of 5">'+"●".repeat(n)+'<span class="off">'+"●".repeat(5-n)+"</span></span>"};
const calc=(ra,pct,sz)=>{const oil=sz*pct/100;const a=oil*ra/100;return{oil,a,b:oil-a,alc:sz-oil}};
const itemOf=()=>current.type==="mix"?M.find(m=>m.id===current.id):P[current.id];

/* ---------- list ---------- */
function chipsFor(){
  const base=[["all","Sab"],["Summer","Summer"],["Winter","Winter"],["All","All Season"]];
  const extra=tab==="mixes"?[["soft","Soft"],["royal","Royal"]]:[];
  return base.concat(extra,[["fav","★ Pasandeeda"],["bought",tab==="mixes"?"✓ Banwa liya":"✓ Khareed liya"],["notbought",tab==="mixes"?"Abhi nahi banwaya":"Abhi nahi khareeda"]]);
}
function renderChips(){$("#chips").innerHTML=chipsFor().map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}
function passFilter(it,group){
  if(filter==="all")return true;
  if(filter==="fav")return it.fav;
  if(filter==="bought")return it.bought;
  if(filter==="notbought")return !it.bought;
  if(filter==="soft"||filter==="royal")return group===filter;
  return tagCls(it.s)==="t-"+filter;
}
const badges=it=>(it.fav?'<span class="fav" aria-label="Pasandeeda">★</span>':"")+(it.bought?'<span class="bought" aria-label="Khareed liya">✓</span>':"");
function renderList(){
  if(!loaded){$("#results").innerHTML='<div class="empty">Sheet se data aa raha hai…</div>';return}
  const q=$("#q").value.trim().toLowerCase(); let html="";
  const has=arr=>arr.join(" ").toLowerCase().includes(q);
  if(tab==="mixes"){
    const items=M.filter(m=>passFilter(m,m.g)&&(!q||has([m.n,m.d,P[m.a].n,P[m.b].n,P[m.a].t,P[m.a].h,P[m.a].ba,P[m.b].t,P[m.b].h,P[m.b].ba])));
    $("#count").textContent=items.length+" mix";
    [["soft","Soft Signature","office aur rozana"],["royal","Royal & Arabic","party aur shaadi"]].forEach(([g,t,s])=>{
      const grp=items.filter(m=>m.g===g); if(!grp.length)return;
      html+=`<h2 class="group-title">${t}<span>${s}</span></h2><div class="list">`+grp.map(m=>`
        <button class="item" data-mix="${esc(m.id)}">
          <span class="av" aria-hidden="true">${m.no}</span>
          <span class="name"><span class="nm">${esc(m.n)}</span>${badges(m)}</span>
          <span class="sub">${esc(P[m.a].n)} + ${esc(P[m.b].n)}</span>
          <span class="right"><span class="ratio">${m.ra} : ${100-m.ra}</span><span class="tag ${tagCls(m.s)}">${esc(m.s)}</span></span>
        </button>`).join("")+"</div>";
    });
  } else {
    const items=Object.values(P).filter(p=>passFilter(p)&&(!q||has([p.n,p.b,p.t,p.h,p.ba,p.c])));
    $("#count").textContent=items.length+" perfumes";
    if(items.length) html='<div class="list" style="margin-top:6px">'+items.map(p=>`
      <button class="item" data-p="${esc(p.id)}">
        <span class="av" aria-hidden="true">${esc(String(p.n).trim().charAt(0).toUpperCase())}</span>
        <span class="name"><span class="nm">${esc(p.n)}</span>${badges(p)}</span>
        <span class="sub">${esc(p.b)}${p.c?" · "+esc(p.c):""}</span>
        <span class="right"><span class="tag ${tagCls(p.s)}">${esc(p.s)}</span>${dots(p.i)}</span>
      </button>`).join("")+"</div>";
  }
  if(!html){
    const msg={fav:"Abhi koi pasandeeda nahi. Kisi item ko kholein aur ★ dabayein.",bought:"Abhi kuch mark nahi kiya. Item khol kar ✓ dabayein."}[filter]||"Is naam ya note se kuch nahi mila.";
    html=`<div class="empty">${msg}<br><button class="chip" id="reset">Sab dikhayein</button></div>`;
  }
  $("#results").innerHTML=html;
}

    <div>

}
function headBtns(it){

function boughtBlock(it,label){
  if(!it.bought) return "";

const actions=()=>`<div class="actions"><button class="btn" id="editbtn">Tabdeel karein</button><button class="btn danger" id="delbtn">Hatayein</button></div>`;

function openMix(id,keep){

function openPerfume(k,keep){

function showSheet(){$("#ov").classList.add("open");$("#sheet").classList.add("open");$("#sheet").scrollTop=0;setTimeout(()=>{const c=$("#close");c&&c.focus({preventScroll:true})},50)}

const kindOf=()=>current.type==="mix"?"mix":"perfume";

    <div class="sheet-head"><div><h2 id="sheet-title">${id?"Mix tabdeel karein":"Naya mix"}</h2></div><button class="iconbtn" id="close" aria-label="Band karein">✕</button></div>
    <form class="form" id="mform">
      <div class="field"><label for="g-n">Mix ka naam *</label><input id="g-n" required value="${esc(m.n)}" placeholder="Jaise: Morning Musk"></div>
      <div class="field"><label for="g-d">Khushbu kaisi hai</label><input id="g-d" value="${esc(m.d)}"></div>
      <div class="field"><label for="g-a">Perfume A</label><select id="g-a">${popts(m.a)}</select></div>
      <div class="field"><label for="g-b">Perfume B</label><select id="g-b">${popts(m.b)}</select></div>
      <div class="field"><label for="g-r">Ratio A : B</label><input id="g-r" type="range" min="10" max="90" step="5" value="${m.ra}"><div class="rangeval"><span>B zyada</span><b id="g-rv">${m.ra} : ${100-m.ra}</b><span>A zyada</span></div></div>
      <div class="field"><label for="g-p">Oil %</label><input id="g-p" type="range" min="15" max="35" value="${m.pct}"><div class="rangeval"><span>Halka</span><b id="g-pv">${m.pct}%</b><span>Tez</span></div></div>
      <div class="field"><label for="g-g">Hissa</label><select id="g-g"><option value="soft" ${m.g==="soft"?"selected":""}>Soft Signature (office)</option><option value="royal" ${m.g==="royal"?"selected":""}>Royal & Arabic (party)</option></select></div>
      <div class="field"><label for="g-s">Season</label><select id="g-s">${opt(seasons,m.s)}</select></div>
      <div class="field"><label for="g-o">Kis mauqe ke liye</label><input id="g-o" value="${esc(m.o)}"></div>
      <div class="field"><label for="g-i">Intensity: <b id="g-iv">${m.i||2}</b> / 5</label><input id="g-i" type="range" min="1" max="5" value="${m.i||2}"></div>
      <div class="field"><label for="g-t">Tip</label><input id="g-t" value="${esc(m.tip)}"></div>
      <button class="btn primary" type="submit">${id?"Tabdeeli save karein":"Mix add karein"}</button>
    </form>`;
  showSheet();
  $("#g-r").oninput=e=>$("#g-rv").textContent=e.target.value+" : "+(100-e.target.value);
  $("#g-p").oninput=e=>$("#g-pv").textContent=e.target.value+"%";
  $("#g-i").oninput=e=>$("#g-iv").textContent=e.target.value;
  $("#mform").onsubmit=e=>{e.preventDefault();
    const v=x=>$("#"+x).value.trim(); if(!v("g-n"))return;
    if(v("g-a")===v("g-b")){toast("Dono perfume alag chunein");return}
    const obj={id:id||"",n:v("g-n"),d:v("g-d"),a:v("g-a"),b:v("g-b"),ra:+v("g-r"),pct:+v("g-p"),g:v("g-g"),s:v("g-s"),o:v("g-o"),i:+v("g-i"),tip:v("g-t"),bought:!!m.bought,date:m.date||"",note:m.note||"",fav:!!m.fav};
    $("#mform button[type=submit]").disabled=true;
    serverWrite("saveMix",[obj],id?"Save ho gaya":"Mix add ho gaya").then(r=>{if(r&&r.id)openMix(r.id)});
  };
}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200)}

/* ---------- custom tab ---------- */
function fillSelects(){
  const opts=Object.values(P).map(p=>`<option value="${esc(p.id)}">${esc(p.n)}</option>`).join("");
  $("#ca").innerHTML=opts; $("#cb").innerHTML=opts;
  const c=PREF.custom, keys=Object.keys(P);
  $("#ca").value=P[c.a]?c.a:keys[0]; $("#cb").value=P[c.b]?c.b:keys[1]; $("#cr").value=c.r; $("#cp").value=c.p;
}
function renderCustom(){
  if(!loaded){$("#custom-out").innerHTML='<div class="empty">Sheet se data aa raha hai…</div>';return}
  if($("#ca").options.length!==Object.keys(P).length)fillSelects();
  const a=$("#ca").value,b=$("#cb").value,r=+$("#cr").value,p=+$("#cp").value;
  PREF.custom={a,b,r,p}; savePref();
  $("#crv").textContent=r+" : "+(100-r); $("#cpv").textContent=p+"%";
  let warn="";
  const strong=[a,b].filter(k=>(P[k].i||0)>=4).map(k=>P[k].n);
  if(a===b) warn="Dono perfume aik hi hain. Mix ke liye alag perfume chunein.";
  else if(strong.length&&p>25) warn=strong.join(" aur ")+" strong hai. Soft khushbu ke liye oil 25% ya kam rakhein.";
  else if(p>30) warn="30% se zyada oil se khushbu tez ho jayegi.";
  $("#custom-out").innerHTML=mixPanel(P[a].n,P[b].n,r,p,"c")+(warn?`<div class="block tip"><p>${esc(warn)}</p></div>`:"")+
    (a!==b?`<button class="btn primary" id="savecustom" style="width:100%;margin-top:12px">Is mix ko list mein save karein</button>`:"");
}

/* ---------- tabs & events ---------- */
function setTab(t){
  tab=t; filter="all"; $("#q").value="";
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("#view-list").hidden=t==="custom"; $("#view-custom").hidden=t!=="custom"; $("#dockrow").hidden=t==="custom";
  $("#fab").setAttribute("aria-label",t==="mixes"?"Naya mix add karein":"Naya perfume add karein");
  const titles={mixes:["Mix formulas","Mix chunein aur gram ka hisaab dekhein"],perfumes:["Perfumes","Har perfume ke notes aur us ke mixes"],custom:["Apna mix","Koi bhi do perfume, apna ratio"]};
  $("#title").firstChild.textContent=titles[t][0]; $("#subtitle").textContent=titles[t][1];
  if(t==="custom"){$("#count").textContent="";if(loaded)fillSelects();renderCustom()} else {renderChips();renderList()}
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.type==="submit"&&t.closest("form"))return;
  if(t.dataset.tab) return setTab(t.dataset.tab);
  if(t.dataset.f){filter=t.dataset.f;renderChips();renderList();return}
  if(t.id==="reset"){filter="all";$("#q").value="";renderChips();renderList();return}
  if(t.id==="retry"){$("#results").innerHTML='<div class="empty">Sheet se data aa raha hai…</div>';return load()}
  if(t.dataset.mix) return openMix(t.dataset.mix);
  if(t.dataset.p) return openPerfume(t.dataset.p);
  if(t.id==="close") return closeSheet();
  if(t.id==="favbtn") return toggle("fav");
  if(t.id==="buybtn") return toggle("bought");
  if(t.id==="delbtn") return askDelete(t);
  if(t.id==="editbtn") return current.type==="mix"?mixForm(current.id):perfumeForm(current.id);
  if(t.id==="fab") return loaded&&(tab==="mixes"?mixForm():perfumeForm());
  if(t.id==="savecustom"){const c=PREF.custom;return mixForm(null,{a:c.a,b:c.b,ra:c.r,pct:c.p})}
  if(t.dataset.size){PREF.size=+t.dataset.size;savePref();
    if(current&&current.type==="mix") openMix(current.id,$("#sheet").scrollTop||1); else if(tab==="custom") renderCustom(); return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="bnote"&&current){const it=itemOf();if(it){it.note=e.target.value;serverWrite("setStatus",[kindOf(),current.id,"note",e.target.value],"Note save ho gaya")}}
});
$("#ov").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&current)closeSheet()});
$("#q").addEventListener("input",renderList);
["ca","cb","cr","cp"].forEach(id=>$("#"+id).addEventListener("input",renderCustom));

setTab("perfumes");
load();

if("serviceWorker" in navigator&&!hasGAS&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

/* title page: tap/Enter se band, is session mein dobara nahi */
(function(){
  const s=$("#splash");
  if(hasGAS)s.style.backgroundImage='url("https://fam-de-studio.github.io/signature-scent/title.jpg")';
  try{if(sessionStorage.getItem("ss-splash")){s.remove();return}}catch(e){}
  const done=()=>{s.classList.add("gone");try{sessionStorage.setItem("ss-splash","1")}catch(e){}setTimeout(()=>s.remove(),600)};
  s.addEventListener("click",done);
  setTimeout(done,4500);
})();

</script>
</body>
</html>
